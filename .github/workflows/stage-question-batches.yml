name: Validate Question Batch Archive

on:
  push:
    branches: [main]
    paths:
      - "src/question-batches/**"
      - "scripts/validate-question-batches.mjs"
  pull_request:
    paths:
      - "src/question-batches/**"
      - "scripts/validate-question-batches.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub question archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate generated question batches
        run: npm run validate:question-batches
