name: Question bank deadline automation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: quickrn-question-bank-generation
  cancel-in-progress: false
jobs:
  generate-and-validate:
    if: github.ref == 'refs/heads/design/professional-quickrn'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/professional-quickrn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate, validate and repair deadline batches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          TARGET_QUESTION_COUNT: "3600"
          BASELINE_QUESTION_COUNT: "600"
          DEADLINE_UTC: "2026-11-29T16:00:00Z"
        run: node scripts/question-bank-automation.mjs
      - name: Commit accepted batches and progress manifest
        run: |
          if [ -n "$(git status --porcelain question-bank-generated)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add question-bank-generated
            git commit -m "chore(question-bank): generate deadline batches"
            git push
          else
            echo "No accepted question batches to commit."
          fi
