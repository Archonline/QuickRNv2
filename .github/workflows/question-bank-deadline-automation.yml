name: Question bank deadline automation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: quickrn-question-bank-generation
  cancel-in-progress: false
jobs:
  generate-and-validate:
    if: github.ref == 'refs/heads/design/professional-quickrn'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/professional-quickrn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-qwen2.5-7b-instruct-v1
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null
      - name: Pull free local generation model
        run: ollama pull qwen2.5:7b-instruct
      - name: Generate, validate and repair deadline batches
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:7b-instruct
          TARGET_QUESTION_COUNT: "3600"
          BASELINE_QUESTION_COUNT: "600"
          DEADLINE_UTC: "2026-11-29T16:00:00Z"
        run: node scripts/question-bank-automation.mjs
      - name: Commit accepted batches and progress manifest
        run: |
          if [ -n "$(git status --porcelain question-bank-generated)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add question-bank-generated
            git commit -m "chore(question-bank): generate deadline batches"
            git push
          else
            echo "No accepted question batches to commit."
          fi
