name: QuickRN design safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "design/professional-quickrn"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickrn-design-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax-check question-bank automation
        run: node --check scripts/question-bank-automation.mjs
      - name: Run design isolation regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
